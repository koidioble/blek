name: koidio_ble
description: "Koidio Y. Blé - Personal portfolio and resume showcasing."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  animate_do: ^4.2.0
  animated_text_kit: ^4.3.0
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_launcher_icons: ^0.14.4
  flutter_localization: ^0.3.3
  flutter_localizations:
    sdk: flutter
  flutter_staggered_animations: ^1.1.1
  flutter_svg: ^2.3.0
  flutter_tilt: ^3.3.2
  font_awesome_flutter: ^11.0.0
  glassmorphism_ui: ^0.3.0
  google_fonts: ^8.0.2
  http: ^1.6.0
  intl: ^0.20.2
  lottie: ^3.3.3
  provider: ^6.1.1
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true

  assets:

    #Logo
    - assets/logo/KYB_icon_dark.png
    - assets/logo/KYB_icon_light.png

    # Pictures
    - assets/pics/half_body.JPG
    - assets/pics/pic2.webp


    #portfolio
    - assets/portfolio/nkommo_cover.webp
    - assets/portfolio/ma_cacaoyere_cover.webp
    - assets/portfolio/babylon_ai_cover.webp
    - assets/portfolio/digba_gym_cover.webp
    - assets/portfolio/salon_booking_cover.webp
    - assets/portfolio/siikaa_cover.webp
    - assets/portfolio/harmattan_cover.webp



flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/pics/bio.png"
  macos: true
  windows: true
  web:
    generate: true
    image_path: "assets/pics/bio.png"
    favicon_path: "assets/pics/bio.png"
