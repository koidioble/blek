buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.0' // Match settings.gradle
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.0' // Match settings.gradle
        classpath 'com.google.gms:google-services:4.4.2' // For Firebase Analytics
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}


def newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.set(newBuildDir)

subprojects {
    def newSubprojectBuildDir = newBuildDir.dir(project.name)
    project.layout.buildDirectory.set(newSubprojectBuildDir)
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}